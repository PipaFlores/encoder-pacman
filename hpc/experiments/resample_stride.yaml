# Compression sweep: how much can sequences be shortened before the results change?
#
# resample_stride keeps one step in N (issue #34). With speed_correction on (the default), a
# step is N frames of Pac-Man movement at full speed, so every level is compressed by the
# same factor. Values are read at each kept step, never averaged over it, so positions stay
# on the maze. Stride 1 is the uncompressed reference; at stride 4 quick reversals (about 5
# frames) start to fall between steps.
#
# Each model is a bundle: an embedder together with its own latent size, written once and
# crossed with every stride. Set latent_space to the values your latent sweep identified;
# the 128s below are placeholders (what general_training.yaml uses today). The transformer's
# latent_space is its d_model with 8 heads, so it must stay a multiple of 8.
#
# Each stride trains its own checkpoints (suffix _stride<n>) and gets its own label, so the
# runs do not overwrite or shadow each other.
#
#   python run_experiment.py --config experiments/resample_stride.yaml --dry-run
#   ./submit_experiment.sh experiments/resample_stride.yaml
name: resample_stride
description: "resample_stride - compression by a fixed factor on speed-corrected sequences (#34)"

slurm:
  partition: gpumedium
  account: project_2012947
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 72          # 72 cores per reserved GPU, and they cost nothing extra
  # No mem_per_cpu: Roihu grants the reserved GH200's full 217 GiB automatically, and
  # that is also the QOS ceiling - requesting memory explicitly can only overshoot it.
  gres: "gpu:gh200:1"         # 1 GPU per node
  time: "02:00:00"

defaults:
  sequence_type: pacman_attack
  feature_set: Experimental2
  normalization: global
  n_epochs: 100
  batch_size: 32
  validation_split: 0.3
  dropout: 0.1
  context: 20
  filter_by_pill: null
  elementwise_masking: False
  rebase_score: true
  sort_ghost_distances: true
  speed_correction: true
  clusterer: hdbscan
  reducer: umap
  validation_method: Behavlets
  verbose: true

grid:
  model:                                  # one bundle per embedder: its own latent size
    - {embedder: LSTM,        latent_space: 128}   # placeholder: set the optimal value
    - {embedder: MLP,         latent_space: 128}   # placeholder: set the optimal value
    - {embedder: Transformer, latent_space: 128}   # placeholder: multiple of 8
    - {embedder: none}                             # UMAP on the raw sequences, no latent size
  resample_stride: [1, 2, 4]
