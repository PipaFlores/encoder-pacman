# Replaces the former train_UMAP.sh: no learned embedder, UMAP reduces the flat raw
# sequences directly. The non-learned baseline for the deep-embedding runs.
name: umap_baseline
description: "testing Umap embedding"

slurm:
  partition: gpumedium
  account: project_2012947
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 72          # 72 cores per reserved GPU, and they cost nothing extra
  # No mem_per_cpu: Roihu grants the reserved GH200's full 217 GiB automatically, and
  # that is also the QOS ceiling - requesting memory explicitly can only overshoot it.
  gres: "gpu:gh200:1"         # 1 GPU per node
  time: "01:00:00"

defaults:
  feature_set: Experimental2
  embedder: null          # skip embedding; the reducer embeds the raw data itself
  clusterer: hdbscan
  reducer: umap
  reducer_components: 2
  umap_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: euclidean
  normalization: global
  context: 20
  filter_by_pill: null
  elementwise_masking: true
  validation_method: Behavlets
  verbose: true

grid:
  sequence_type: [pacman_attack, last_5_seconds]
